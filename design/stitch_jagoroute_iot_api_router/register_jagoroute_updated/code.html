<body class="bg-gradient-to-br from-background to-surface-container-highest min-h-screen flex items-center justify-center p-4">
<!-- Auth Container -->
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.2)] overflow-hidden">
<!-- Top decorative border -->
<div class="h-1 w-full bg-primary"></div>
<div class="p-8">
<!-- Brand Block -->
<div class="flex items-center gap-2 mb-8 justify-center">
<div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[20px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">conversion_path</span>
</div>
<span class="font-headline-md text-headline-md text-primary font-bold">JagoRoute</span>
</div>
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join the JagoRoute workspace</p>
</div>
<!-- Form -->
<form action="#" class="flex flex-col gap-4" method="POST">
<!-- Full Name -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="fullName">Full name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-150" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-150" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block text-sm font-medium text-on-surface mb-2" for="password">Password</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-3 py-2 text-sm text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-150" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<p class="mt-2 text-xs text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">info</span>
                        8+ characters
                    </p>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full flex items-center justify-center gap-2 bg-primary text-on-primary rounded-lg py-3 px-4 text-sm font-medium hover:bg-opacity-90 active:scale-[0.99] transition-all duration-150" type="submit">
<span class="material-symbols-outlined" data-icon="person_add">person_add</span>
                    Create account
                </button>
</form>
<!-- Footer -->
<div class="mt-8 text-center border-t border-outline-variant pt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-medium hover:underline transition-all" href="#">Sign in</a>
</p>
</div>
</div>
</div>
</body></html>
